<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Executive Operations AI Workspace preview</title>
  <desc id="desc">Illustrative preview of the dashboard included in the Calendar Assistant portfolio project.</desc>
  <rect width="1440" height="900" rx="28" fill="#f8fafc"/>
  <rect x="0" y="0" width="1440" height="78" rx="28" fill="#312e81"/>
  <rect x="0" y="50" width="1440" height="28" fill="#312e81"/>
  <circle cx="58" cy="39" r="16" fill="#ffffff" opacity=".18"/>
  <text x="90" y="47" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">Executive Operations AI Workspace</text>
  <text x="1128" y="45" font-family="Arial,sans-serif" font-size="14" fill="#c7d2fe">Dashboard   Calendar   AI Assistant</text>

  <rect x="38" y="110" width="1364" height="180" rx="24" fill="#0f172a"/>
  <text x="74" y="150" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#a5b4fc">EXECUTIVE OPERATIONS COMMAND CENTER</text>
  <text x="74" y="196" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Priorities, schedules, follow-ups and AI-assisted admin work.</text>
  <text x="74" y="230" font-family="Arial,sans-serif" font-size="16" fill="#cbd5e1">A practical internal workspace for executive support and office coordination.</text>
  <rect x="74" y="250" width="130" height="34" rx="9" fill="#ffffff"/>
  <text x="101" y="272" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">Open calendar</text>
  <rect x="216" y="250" width="144" height="34" rx="9" fill="#4338ca"/>
  <text x="241" y="272" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Open AI assistant</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(38 318)">
      <rect width="316" height="104" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="30" font-size="12" font-weight="700" fill="#64748b">TODAY</text>
      <text x="20" y="70" font-size="32" font-weight="700" fill="#0f172a">4</text>
      <text x="64" y="69" font-size="13" fill="#64748b">scheduled items</text>
    </g>
    <g transform="translate(370 318)">
      <rect width="316" height="104" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="30" font-size="12" font-weight="700" fill="#64748b">PRIORITY</text>
      <text x="20" y="70" font-size="32" font-weight="700" fill="#0f172a">2</text>
      <text x="64" y="69" font-size="13" fill="#64748b">follow-ups</text>
    </g>
    <g transform="translate(702 318)">
      <rect width="316" height="104" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="30" font-size="12" font-weight="700" fill="#64748b">DOCUMENTS</text>
      <text x="20" y="70" font-size="32" font-weight="700" fill="#0f172a">3</text>
      <text x="64" y="69" font-size="13" fill="#64748b">drafts in progress</text>
    </g>
    <g transform="translate(1034 318)">
      <rect width="368" height="104" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="30" font-size="12" font-weight="700" fill="#64748b">OFFICE REQUESTS</text>
      <text x="20" y="70" font-size="32" font-weight="700" fill="#0f172a">4</text>
      <text x="64" y="69" font-size="13" fill="#64748b">active workstreams</text>
    </g>
  </g>

  <rect x="38" y="450" width="880" height="392" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="66" y="490" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">Today’s executive brief</text>
  <text x="66" y="516" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Priority information formatted for fast review.</text>

  <text x="66" y="558" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">PRIORITY FOLLOW-UPS</text>
  <g font-family="Arial,sans-serif">
    <rect x="66" y="578" width="394" height="70" rx="14" fill="#f8fafc"/>
    <circle cx="96" cy="613" r="16" fill="#e0e7ff"/>
    <text x="91" y="618" font-size="12" font-weight="700" fill="#4338ca">1</text>
    <text x="126" y="606" font-size="14" font-weight="700" fill="#0f172a">Confirm vendor timeline</text>
    <text x="126" y="628" font-size="12" fill="#64748b">Owner, due time and next action visible.</text>

    <rect x="66" y="660" width="394" height="70" rx="14" fill="#f8fafc"/>
    <circle cx="96" cy="695" r="16" fill="#e0e7ff"/>
    <text x="91" y="700" font-size="12" font-weight="700" fill="#4338ca">2</text>
    <text x="126" y="688" font-size="14" font-weight="700" fill="#0f172a">Prepare executive meeting pack</text>
    <text x="126" y="710" font-size="12" fill="#64748b">Agenda, notes, attachments and follow-up.</text>
  </g>

  <text x="500" y="558" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#94a3b8">AI PRODUCTIVITY</text>
  <rect x="500" y="578" width="386" height="238" rx="16" fill="#0f172a"/>
  <text x="524" y="611" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">AI output preview</text>
  <text x="524" y="650" font-family="Arial,sans-serif" font-size="13" fill="#cbd5e1">EXECUTIVE BRIEF</text>
  <text x="524" y="682" font-family="Arial,sans-serif" font-size="12" fill="#cbd5e1">• 4 scheduled items, 2 priority follow-ups</text>
  <text x="524" y="710" font-family="Arial,sans-serif" font-size="12" fill="#cbd5e1">• One timing conflict needs confirmation</text>
  <text x="524" y="738" font-family="Arial,sans-serif" font-size="12" fill="#cbd5e1">• Vendor approval needed before 2:00 PM</text>
  <text x="524" y="766" font-family="Arial,sans-serif" font-size="12" fill="#cbd5e1">• Send consolidated follow-up after meeting</text>

  <rect x="944" y="450" width="458" height="392" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="972" y="490" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">Office operations</text>
  <text x="972" y="516" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Recurring admin work in one control center.</text>
  <g font-family="Arial,sans-serif">
    <text x="972" y="566" font-size="14" font-weight="700" fill="#0f172a">Visitor coordination</text>
    <text x="972" y="590" font-size="12" fill="#64748b">Guest list, host and access notes</text>
    <rect x="1284" y="548" width="82" height="26" rx="13" fill="#eef2ff"/>
    <text x="1304" y="566" font-size="11" font-weight="700" fill="#4338ca">Ready</text>
    <line x1="972" y1="615" x2="1366" y2="615" stroke="#e2e8f0"/>

    <text x="972" y="652" font-size="14" font-weight="700" fill="#0f172a">Vendor follow-up</text>
    <text x="972" y="676" font-size="12" fill="#64748b">Quotes, commitments and next action</text>
    <rect x="1284" y="634" width="82" height="26" rx="13" fill="#eef2ff"/>
    <text x="1304" y="652" font-size="11" font-weight="700" fill="#4338ca">2 open</text>
    <line x1="972" y1="701" x2="1366" y2="701" stroke="#e2e8f0"/>

    <text x="972" y="738" font-size="14" font-weight="700" fill="#0f172a">Document preparation</text>
    <text x="972" y="762" font-size="12" fill="#64748b">Briefings, agendas and follow-up drafts</text>
    <rect x="1284" y="720" width="82" height="26" rx="13" fill="#eef2ff"/>
    <text x="1304" y="738" font-size="11" font-weight="700" fill="#4338ca">3 drafts</text>
  </g>
</svg>